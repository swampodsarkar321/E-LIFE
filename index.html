const NATURE = [

function loadTreeFile(f){

function prepTreeModel(g, targetH, byWidth){
  const o = g.scene;
  o.updateMatrixWorld(true);
  const size = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
  const s0 = byWidth ? 1.9 / Math.max(size.x, size.z, 0.01) : targetH / (size.y || 1);

  return {o, minY:new THREE.Box3().setFromObject(o).min.y};

async function loadTemplates(onStep){
  const jobs = [];
  for (const t of NATURE) for (const f of t.files) jobs.push({t, f:'tree/' + encodeURIComponent(f)});
  for (const f of PATH_FILES) jobs.push({f:'tree/' + encodeURIComponent(f), path:true});

// shared house assets
const wallC=[0xe8d9b5,0xd9a37a,0xb5c9d9,0xe0b5b5], roofC=[0x8b2f2f,0x4a4a6a,0x6a4a2a];
const houseBoxGeo = new THREE.BoxGeometry(1,1,1);
const houseRoofGeo = new THREE.ConeGeometry(1,1,4);
const houseWallMats = wallC.map(c => new THREE.MeshLambertMaterial({color:c}));
const houseRoofMats = roofC.map(c => new THREE.MeshLambertMaterial({color:c}));
const chunks = new Map();
function makeChunk(ccx, ccz){
  const key = ccx + ',' + ccz;
  const g = new THREE.Group();
  const R = mulberry(hashSeed(ccx, ccz));
  const x0 = ccx*CHUNK, z0 = ccz*CHUNK;
  const coll = [];
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(x0, 0, z0);
  ground.receiveShadow = true;
  g.add(ground);
  for (const entry of tplNature){
    const t = entry.t, models = entry.models;
    if (!models.length) continue;
    for (let i = 0, tries = 0; i < t.n && tries < t.n*10; tries++){
      const x = x0 + (R()-0.5)*CHUNK*0.94, z = z0 + (R()-0.5)*CHUNK*0.94;
      if (nearPath(x,z)) continue;
      const v = 0.8 + R()*0.5, cr = (t.c || 0) * v;
      if (cr ? !free(x,z,cr) : Math.hypot(x,z) < 8) continue;
      const tp = models[Math.floor(R()*models.length)];
      const c = tp.o.clone();
      c.position.set(x, -tp.minY*v, z);
      c.rotation.y = R()*Math.PI*2;
      c.scale.multiplyScalar(v);
      g.add(c);
      if (cr){ const o2 = {x, z, r:cr}; colliders.push(o2); coll.push(o2); }
      i++;
    }
  }
  const nH = 1 + (R() < 0.5 ? 1 : 0);
  for (let c = 0, tries = 0; c < nH && tries < 40; tries++){
    const x = x0 + (R()-0.5)*CHUNK*0.8, z = z0 + (R()-0.5)*CHUNK*0.8;
    if (nearPath(x,z)) continue;
    const w = 5+R()*3, d = 5+R()*3, h = 3.5;
    if (!free(x,z,Math.max(w,d)*0.8)) continue;
    const hg = new THREE.Group();
    const b = new THREE.Mesh(houseBoxGeo, houseWallMats[Math.floor(R()*houseWallMats.length)]);
    b.scale.set(w,h,d); b.position.y = h/2; b.castShadow = b.receiveShadow = true;
    const md = Math.max(w,d);
    const rf = new THREE.Mesh(houseRoofGeo, houseRoofMats[Math.floor(R()*houseRoofMats.length)]);
    rf.scale.set(md*0.78, 2.5, md*0.78); rf.position.y = h+1.25; rf.rotation.y = Math.PI/4; rf.castShadow = true;
    hg.add(b,rf); hg.position.set(x,0,z); hg.rotation.y = Math.floor(R()*4)*Math.PI/2; g.add(hg);
    const o2 = {x, z, r:md*0.5*1.05}; colliders.push(o2); coll.push(o2); c++;
  }
  if (ccx === 0 && tplPath.length){
    const lo = Math.max(2, z0-CHUNK/2), hi = Math.min(62, z0+CHUNK/2);
    for (let k = Math.ceil((lo-2)/4); 2+k*4 <= hi; k++){
      const z = 2+k*4, x = pathX(z);
      const t = tplPath[Math.floor(R()*tplPath.length)];
      const c = t.o.clone();
      c.position.set(x, -t.minY + 0.03, z);
      c.rotation.y = R()*0.4;
      g.add(c);
    }
  }
  g.userData.coll = coll;
  scene.add(g);
  chunks.set(key, g);
}
function dropChunk(key){
  const g = chunks.get(key); if (!g) return;
  scene.remove(g);
  for (const c of g.userData.coll){ const i = colliders.indexOf(c); if (i >= 0) colliders.splice(i,1); }
  chunks.delete(key);
}
let lastCX = 1e9, lastCZ = 1e9;
function ensureGrid(px, pz){
  if (!tplReady) return;
  const pcx = Math.floor(px/CHUNK+0.5), pcz = Math.floor(pz/CHUNK+0.5);
  if (pcx === lastCX && pcz === lastCZ) return;
  lastCX = pcx; lastCZ = pcz;
  for (let dx = -RANGE; dx <= RANGE; dx++) for (let dz = -RANGE; dz <= RANGE; dz++){
    const key = (pcx+dx) + ',' + (pcz+dz);
    if (!chunks.has(key)) makeChunk(pcx+dx, pcz+dz);
  }
  for (const key of [...chunks.keys()]){
    const parts = key.split(',');
    if (Math.abs(+parts[0]-pcx) > RANGE || Math.abs(+parts[1]-pcz) > RANGE) dropChunk(key);
  }
}

async function loadRemote(rm, d){

    const g = await new Promise((res, rej) => loader.load('models/' + encodeURIComponent(d.char || 'Adventurer') + '.glb', res, undefined, rej));

async function initVoice(){
  if (voiceReady || !window.AgoraRTC) return;
  micEl.textContent = '…';
  try {
    voiceClient = AgoraRTC.createClient({mode:'rtc', codec:'vp8'});
    await voiceClient.join(AGORA_ID, 'world', null, myUid);
    micTrack = await AgoraRTC.createMicrophoneAudioTrack();
    await voiceClient.publish(micTrack);
    const subOne = async u => {
      try {
        await voiceClient.subscribe(u, 'audio');
        subs.set(u.uid, u.audioTrack);
        u.audioTrack.setVolume(0);
        try { u.audioTrack.play(); } catch(e){}
      } catch(e){}
    };
    voiceClient.on('user-published', (user, type) => { if (type === 'audio') subOne(user); });
    voiceClient.on('user-unpublished', user => { subs.delete(user.uid); });
    voiceClient.remoteUsers.forEach(u => { if (u.hasAudio) subOne(u); });
    voiceReady = true;
    micEl.innerHTML = SVG_MIC;
  } catch(e){ console.error('voice failed', e); micEl.innerHTML = SVG_MUTE; }
}
function updateVoice(){

  if (cur){
    if (mode === 'play'){
      let f = (keys.KeyW||keys.ArrowUp?1:0) - (keys.KeyS||keys.ArrowDown?1:0) + joy.f;
      let r = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0) + joy.r;
      const mag = Math.hypot(f, r);
      if (mag > 1){ f /= mag; r /= mag; }
      const moving = mag > 0.15;
      const airborne = cur.position.y > 0.02 || vy !== 0;
      if (moving){
        const run = keys.ShiftLeft || keys.ShiftRight || joy.run;
        let sp = (run ? 8 : 3.5) * Math.min(1, Math.max(mag, 0.45));
        if (airborne) sp *= 0.6; // air control কম
        const dx = -Math.sin(yaw)*f + Math.cos(yaw)*r, dz = -Math.cos(yaw)*f - Math.sin(yaw)*r;
        const len = Math.hypot(dx,dz);
        cur.position.x += dx/len*sp*dt; cur.position.z += dz/len*sp*dt;
        const target = Math.atan2(dx,dz); let d = target - cur.rotation.y;
        d = Math.atan2(Math.sin(d), Math.cos(d)); cur.rotation.y += d*Math.min(1, dt*12);
        emoteT = 0; toggleEmotes(false); play(airborne ? 'Run' : (run ? 'Run' : 'Walk'));
      } else if (emoteT > 0){ emoteT -= dt; play(emote); }
      else if (!airborne) play('Idle');
      // jump (Space): buffer + ভারী gravity + squash & stretch
      jumpBuf = Math.max(0, jumpBuf - dt);
      if (jumpBuf > 0 && cur.position.y <= 0.01){ vy = 6.5; jumpBuf = 0; squash = -0.1; }
      if (cur.position.y > 0 || vy !== 0){
        cur.position.y += vy*dt; vy -= 18*dt;
        if (cur.position.y <= 0){ cur.position.y = 0; vy = 0; squash = 0.13; }
      }
      if (squash !== 0){
        const k = Math.max(0, squash > 0 ? squash/0.13 : -squash/0.1);
        if (squash > 0){ cur.scale.set(1+0.18*k, 1-0.28*k, 1+0.18*k); squash -= dt; if (squash <= 0){ squash = 0; cur.scale.set(1,1,1); } }
        else { cur.scale.set(1-0.1*k, 1+0.15*k, 1-0.1*k); squash += dt; if (squash >= 0){ squash = 0; cur.scale.set(1,1,1); } }
      }
      for (const c of colliders){
        const ox = cur.position.x - c.x, oz = cur.position.z - c.z, dd = Math.hypot(ox,oz), min = c.r + .4;
        if (dd < min && dd > 0){ cur.position.x = c.x + ox/dd*min; cur.position.z = c.z + oz/dd*min; }
      }
      look.set(cur.position.x, 1.5, cur.position.z);
      camera.position.set(look.x + Math.sin(yaw)*Math.cos(pitch)*dist, look.y + Math.sin(pitch)*dist, look.z + Math.cos(yaw)*Math.cos(pitch)*dist);
      ensureGrid(cur.position.x, cur.position.z);
    } else {
      yaw = 0;
      look.set(cur.position.x, 1.1, cur.position.z);
      camera.position.set(look.x, 1.4, look.z + 4.2);
    }
    camera.lookAt(look);
    // day-night cycle (240s)
    elapsed += dt;
    const ang = (elapsed/240)*Math.PI*2;
    const dayF = THREE.MathUtils.clamp(Math.sin(ang)*2 + 0.3, 0, 1);
    isNight = Math.sin(ang) < -0.08;
    scene.background.copy(nightSky).lerp(daySky, dayF);
    scene.fog.color.copy(scene.background);
    sun.intensity = 0.05 + 2.15*dayF;
    hemi.intensity = 0.2 + 0.9*dayF;
    if (cur){
      sun.position.set(cur.position.x + Math.cos(ang)*60, Math.max(10, Math.sin(ang)*60 + 12), cur.position.z + 20);
      sun.target.position.copy(cur.position);
      stars.position.copy(cur.position);
      starMat.opacity = 1 - dayF;
      moon.position.set(cur.position.x - Math.cos(ang)*120, Math.max(15, -Math.sin(ang)*100 + 10), cur.position.z - 60);
    }
    mixer && mixer.update(dt);
    remotesTick(dt);
    sendTick();
    voiceT += dt;
    if (voiceT > 0.5){ voiceT = 0; updateVoice(); }
  }
  const px = cur ? cur.position.x : 0, pz = cur ? cur.position.z : 0;
  for (const c of clouds){
    c.g.position.x += c.sp*dt;
    if (c.g.position.x-px > 180) c.g.position.x -= 360;
    if (c.g.position.x-px < -180) c.g.position.x += 360;
    if (c.g.position.z-pz > 180) c.g.position.z -= 360;
    if (c.g.position.z-pz < -180) c.g.position.z += 360;
  }
  // pond life: boat bob
  {
    const tNow = performance.now()/1000;
    if (boatMesh){ boatMesh.position.y = 0.05 + Math.sin(tNow*1.2)*0.06; boatMesh.rotation.z = Math.sin(tNow*0.9)*0.03; }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
camera.position.set(0,1.4,4.2);
tick();
// third-person follow (camera pechon theke): select = one-by-one, play = follow
Promise.all([
  show(0),
  loadTemplates((d,n) => { load.textContent = 'Building world... ' + d + '/' + n; })
]).then(() => { ensureGrid(0,0); setupPondLife(); load.remove(); CHARS.forEach(n => loadChar(n).catch(()=>{})); }).catch(e => {
  console.error(e);
  document.getElementById('load').textContent = 'Models failed to load! Open via http://localhost:8000 (' + e.message + ')';
});
</script>
</body>
