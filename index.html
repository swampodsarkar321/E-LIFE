const gt = new THREE.CanvasTexture(cv); gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(CHUNK/4, CHUNK/4); gt.colorSpace = THREE.SRGBColorSpace;

function hashSeed(x,z){ let h = (x*374761393 + z*668265263) | 0; h = Math.imul(h ^ (h>>>13), 1274126177); return h>>>0; }
function mulberry(a){ return function(){ a|=0; a = a+0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t+Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
const colliders = [];

// city streets (roads cross every chunk center)

  {files:['Sports Car.glb','Sports Car-Gzj704DXdr.glb'], h:1.4, n:1, c:2.2, road:true},

function loadTreeFile(f){
  return new Promise((res, rej) => loader.load(f, res, undefined, rej));
}
function prepTreeModel(g, targetH, byWidth){
  const o = g.scene;
  o.updateMatrixWorld(true);
  const size = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
  const s0 = byWidth ? 1.9 / Math.max(size.x, size.z, 0.01) : targetH / (size.y || 1);
  o.scale.multiplyScalar(s0); o.updateMatrixWorld(true);
  return {o, minY:new THREE.Box3().setFromObject(o).min.y};
}
const tplCity = [];
let tplReady = false;
async function loadTemplates(onStep){
  const jobs = [];
  const all = [...CITY_BLDG, ...CITY_PROPS, ...CITY_CARS];
  for (const t of all) for (const f of t.files) jobs.push({t, f:'CITY/' + encodeURIComponent(f)});
  const byEntry = new Map();
  let done = 0;
  for (const j of jobs){
    try {
      const g = await loadTreeFile(j.f);
      {
        const p = prepTreeModel(g, j.t.h, false);
        const p = prepTreeModel(g, j.t.h, false);
        p.o.traverse(m => { if (m.isMesh) m.castShadow = !!j.t.shadow; });
        if (!byEntry.has(j.t)) byEntry.set(j.t, []);
        byEntry.get(j.t).push(p);
      }
    } catch(e){ console.error('load failed:', j.f, e); }
    done++; onStep && onStep(done, jobs.length);
  }
  for (const t of all) tplCity.push({t, models:byEntry.get(t) || []});
  tplReady = true;
}
const chunks = new Map();
function makeChunk(ccx, ccz){
  const key = ccx + ',' + ccz;
  const g = new THREE.Group();
  const R = mulberry(hashSeed(ccx, ccz));
  const x0 = ccx*CHUNK, z0 = ccz*CHUNK;
  const coll = [];
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(x0, 0, z0);
  ground.receiveShadow = true;
  g.add(ground);
  // roads: cross through chunk center
  const rx = new THREE.Mesh(roadGeoX, roadMat);
  rx.rotation.x = -Math.PI/2; rx.position.set(x0, 0.02, z0); rx.receiveShadow = true; g.add(rx);
  const rz = new THREE.Mesh(roadGeoZ, roadMat);
  rz.rotation.x = -Math.PI/2; rz.position.set(x0, 0.02, z0); rz.receiveShadow = true; g.add(rz);
  const put = (tp, x, z, v, ry, cr) => {
    const c = tp.o.clone();
    c.position.set(x, -tp.minY*v, z);
    c.rotation.y = ry;
    c.scale.multiplyScalar(v);
    g.add(c);
    if (cr){ const o2 = {x, z, r:cr}; colliders.push(o2); coll.push(o2); }
  };
  for (const entry of tplCity.filter(e => CITY_BLDG.includes(e.t))){
    const t = entry.t, models = entry.models;
    if (!models.length) continue;
    for (const qx of [-1,1]) for (const qz of [-1,1]){
      if (R() > 0.55) continue;
      for (let tries = 0; tries < 8; tries++){
        const x = x0 + qx*(14 + R()*24), z = z0 + qz*(14 + R()*24);
        const v = 0.9 + R()*0.5, cr = (t.c || 5)*v;
        if (!free(x,z,cr)) continue;
        const tp = models[Math.floor(R()*models.length)];
        put(tp, x, z, v, Math.floor(R()*4)*Math.PI/2, cr);
        break;
      }
    }
  }
  // props on sidewalks (near road edges, off-road)
  for (const entry of tplCity.filter(e => CITY_PROPS.includes(e.t))){
    const t = entry.t, models = entry.models;
    if (!models.length) continue;
    for (let i = 0, tries = 0; i < t.n && tries < t.n*10; tries++){
      const side = R() < 0.5;
      const along = (R()-0.5)*CHUNK*0.9;
      const off = 6 + R()*3;
      const sgn = R() < 0.5 ? -1 : 1;
      const x = side ? x0 + along : x0 + sgn*off;
      const z = side ? z0 + sgn*off : z0 + along;
      if (onRoad(x, z) || Math.hypot(x,z) < 8) continue;
      const v = 0.9 + R()*0.3, cr = (t.c || 0)*v;
      if (cr && !free(x,z,cr)) continue;
      const tp = models[Math.floor(R()*models.length)];
      put(tp, x, z, v, R()*Math.PI*2, cr);
      i++;
    }
  }
  // parked cars along roads
  for (const entry of tplCity.filter(e => CITY_CARS.includes(e.t))){
    const t = entry.t, models = entry.models;
    if (!models.length) continue;
    for (let i = 0, tries = 0; i < t.n && tries < t.n*10; tries++){
      const alongX = R() < 0.5;
      const a = (R()-0.5)*CHUNK*0.85;
      const lane = R() < 0.5 ? -6.2 : 6.2;
      const x = alongX ? x0 + a : x0 + lane;
      const z = alongX ? z0 + lane : z0 + a;
      if (Math.hypot(x,z) < 9) continue;
      const v = 0.95 + R()*0.2, cr = (t.c || 2)*v;
      if (!free(x,z,cr)) continue;
      const tp = models[Math.floor(R()*models.length)];
      put(tp, x, z, v, alongX ? (lane > 0 ? Math.PI/2 : -Math.PI/2) : (lane > 0 ? 0 : Math.PI), cr);
      i++;
    }
  }
  g.userData.coll = coll;
  scene.add(g);
  chunks.set(key, g);
}
function dropChunk(key){
  const g = chunks.get(key); if (!g) return;
  scene.remove(g);
  for (const c of g.userData.coll){ const i = colliders.indexOf(c); if (i >= 0) colliders.splice(i,1); }

}

      let r = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0) + joy.r;
      const mag = Math.hypot(f, r);
      if (mag > 1){ f /= mag; r /= mag; }
      const moving = mag > 0.15;
      const airborne = cur.position.y > 0.02 || vy !== 0;
      if (moving){

      // jump (Space): buffer + ভারী gravity + squash & stretch
      jumpBuf = Math.max(0, jumpBuf - dt);
      if (jumpBuf > 0 && cur.position.y <= 0.01){ vy = 6.5; jumpBuf = 0; squash = -0.1; }
      if (cur.position.y > 0 || vy !== 0){
        cur.position.y += vy*dt; vy -= 18*dt;
        if (cur.position.y <= 0){ cur.position.y = 0; vy = 0; squash = 0.13; }
      }
      if (squash !== 0){
        const k = Math.max(0, squash > 0 ? squash/0.13 : -squash/0.1);
        if (squash > 0){ cur.scale.set(1+0.18*k, 1-0.28*k, 1+0.18*k); squash -= dt; if (squash <= 0){ squash = 0; cur.scale.set(1,1,1); } }
        else { cur.scale.set(1-0.1*k, 1+0.15*k, 1-0.1*k); squash += dt; if (squash >= 0){ squash = 0; cur.scale.set(1,1,1); } }
      }
      for (const c of colliders){
        const ox = cur.position.x - c.x, oz = cur.position.z - c.z, dd = Math.hypot(ox,oz), min = c.r + .4;
        if (dd < min && dd > 0){ cur.position.x = c.x + ox/dd*min; cur.position.z = c.z + oz/dd*min; }
      }
      look.set(cur.position.x, 1.5, cur.position.z);
      camera.position.set(look.x + Math.sin(yaw)*Math.cos(pitch)*dist, look.y + Math.sin(pitch)*dist, look.z + Math.cos(yaw)*Math.cos(pitch)*dist);
      ensureGrid(cur.position.x, cur.position.z);
    } else {
      yaw = 0;
      const side = innerWidth > innerHeight ? 1.4 : 0; // landscape: character left
      look.set(cur.position.x + side, 1.1, cur.position.z);
      camera.position.set(cur.position.x, 1.4, cur.position.z + 4.2);
    }
    camera.lookAt(look);
    // day-night cycle (240s)
    elapsed += dt;
    const ang = (elapsed/240)*Math.PI*2;
    const dayF = THREE.MathUtils.clamp(Math.sin(ang)*2 + 0.3, 0, 1);
    isNight = Math.sin(ang) < -0.08;
    scene.background.copy(nightSky).lerp(daySky, dayF);
    scene.fog.color.copy(scene.background);
    sun.intensity = 0.05 + 2.15*dayF;
    hemi.intensity = 0.2 + 0.9*dayF;
    if (cur){
      sun.position.set(cur.position.x + Math.cos(ang)*60, Math.max(10, Math.sin(ang)*60 + 12), cur.position.z + 20);
      sun.target.position.copy(cur.position);
      stars.position.copy(cur.position);
      starMat.opacity = 1 - dayF;
      moon.position.set(cur.position.x - Math.cos(ang)*120, Math.max(15, -Math.sin(ang)*100 + 10), cur.position.z - 60);
    }
    mixer && mixer.update(dt);
    remotesTick(dt);
    sendTick();
    voiceT += dt;
    if (voiceT > 0.5){ voiceT = 0; updateVoice(); }
  }
  const px = cur ? cur.position.x : 0, pz = cur ? cur.position.z : 0;
  for (const c of clouds){
    c.g.position.x += c.sp*dt;
    if (c.g.position.x-px > 180) c.g.position.x -= 360;
    if (c.g.position.x-px < -180) c.g.position.x += 360;
    if (c.g.position.z-pz > 180) c.g.position.z -= 360;
    if (c.g.position.z-pz < -180) c.g.position.z += 360;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
camera.position.set(0,1.4,4.2);
tick();
// third-person follow (camera pechon theke): select = one-by-one, play = follow
Promise.all([
  show(0),
  loadTemplates((d,n) => { load.textContent = 'Building city... ' + d + '/' + n; }),
  (async () => {
    for (let i = 0; i < CHARS.length; i++){
      try { await loadChar(CHARS[i]); } catch(e){}
      load.textContent = 'Loading characters... ' + (i+1) + '/' + CHARS.length;
    }
  })()
]).then(() => { ensureGrid(0,0); load.remove(); }).catch(e => {
  console.error(e);
  document.getElementById('load').textContent = 'Models failed to load! Open via http://localhost:8000 (' + e.message + ')';
});
</script>
