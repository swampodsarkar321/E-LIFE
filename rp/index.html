const satmatha = g => { C(g,9,9,.4,0xd8d8d0,0,0,0,28); for(let i=0;i<7;i++) C(g,.4,.4,5,[0xe53935,0x1e88e5,0xfdd835,0x43a047,0x8e24aa,0xfb8c00,0x00acc1][i],Math.cos(i*.898)*4.5,.4,Math.sin(i*.898)*4.5,8); };
const school = g => { B(g,22,6,8,0xf2e3a0); B(g,24,.6,10,0x2e5da8,0,6,0); C(g,.15,.15,10,0xffffff,12,0,6,6); B(g,2.4,1.5,.1,0x1b8a3a,13.3,8.2,6); };
const medical = g => { B(g,26,11,10,0xeeeeee); B(g,1.6,5,.4,0xd32f2f,0,4,5.1); B(g,5,1.6,.4,0xd32f2f,0,5.7,5.1); B(g,10,16,8,0xdddddd,-18,0,0); };
const cantonment = g => { [[0,-24,50,0],[0,24,50,0],[-25,0,0,48],[25,0,0,48]].forEach(([x,z,w,d]) => B(g,w||.6,2.2,d||.6,0x556b2f,x,0,z)); [-12,0,12].forEach(x => B(g,10,3.5,5,0x8a9a6a,x,0,-10)); B(g,8,3.5,14,0x7a8a5a,-14,0,10); C(g,.15,.15,9,0xdddddd,8,0,12,6); B(g,3,1.8,.1,0x1b8a3a,9.5,6.8,12); };

const vinno = g => { const w = new THREE.Group(); w.position.y = 15; const t = sh(new THREE.Mesh(new THREE.TorusGeometry(12,.4,8,32), M(0xf0f0f0))); w.add(t);
  for(let i=0;i<8;i++){ const a = i*Math.PI/4; const sp = B(w,.2,24,.2,0xcccccc,0,-12,0); sp.rotation.z = a; sp.position.set(0,0,0); sp.geometry.translate(0,0,0); sp.rotation.z = a; B(w,2,2,2,[0xe53935,0x1e88e5,0xfdd835,0x43a047][i%4],Math.sin(a)*12-1,Math.cos(a)*12-1.6,0); }
  g.add(w); spinners.push(w); B(g,1,15,1,0x888888,-3,0,0); B(g,1,15,1,0x888888,3,0,0); [-14,14].forEach(x => { const c = sh(new THREE.Mesh(new THREE.ConeGeometry(4,5,8), M(0xff7043))); c.position.set(x,2.5,10); g.add(c); }); };

const LM = [
 {id:'station',  name:'রংপুর রেলওয়ে স্টেশন', x:30,  z:-118, r:22, h:17, fn:station},
 {id:'shapla',   name:'শাপলা চত্বর',          x:0,   z:-40,  r:13, h:9,  fn:shapla},
 {id:'jahaj',    name:'জাহাজ কোম্পানি মোড়',  x:0,   z:2,    r:9,  h:9,  fn:jahaj},
 {id:'townhall', name:'টাউন হল',              x:-42, z:-20,  r:13, h:13, fn:townhall},
 {id:'jami',     name:'জামে মসজিদ',           x:-34, z:-64,  r:13, h:15, fn:mosque(3)},
 {id:'satmatha', name:'সাতমাথা',              x:62,  z:-42,  r:10, h:8,  fn:satmatha},
 {id:'taraganj', name:'তারাগঞ্জ মসজিদ',       x:96,  z:-62,  r:14, h:15, fn:mosque(4)},
 {id:'modern',   name:'মডার্ন মোড়',          x:44,  z:42,   r:20, h:20, fn:modern},
 {id:'school',   name:'রংপুর জিলা স্কুল',     x:-62, z:30,   r:14, h:11, fn:school},
 {id:'medical',  name:'রংপুর মেডিকেল কলেজ',   x:84,  z:18,   r:22, h:17, fn:medical},
 {id:'stadium',  name:'স্টেডিয়াম ও চিকলি ভাটা', x:118, z:78,  r:30, h:12, fn:stadium},
 {id:'zoo',      name:'রংপুর চিড়িয়াখানা',    x:160, z:20,   r:22, h:8,  fn:zoo},
 {id:'college',  name:'কারমাইকেল কলেজ',       x:-12, z:122,  r:22, h:15, fn:college},
 {id:'tajhat',   name:'তাজহাট জমিদার বাড়ি',  x:22,  z:186,  r:24, h:24, fn:palace},

 {id:'cantt',    name:'রংপুর ক্যান্টনমেন্ট',   x:-92, z:-112, r:30, h:9,  fn:cantonment},
 {id:'ghagat',   name:'ঘাঘট পার্ক',           x:-132,z:-60,  r:14, h:9,  fn:park},
 {id:'vinno',    name:'ভিন্ন জগৎ',            x:185, z:170,  r:26, h:30, fn:vinno},
];
const colliders = [];
function label(text, y){ const c = document.createElement('canvas'); c.width = 512; c.height = 96; const x = c.getContext('2d'); x.fillStyle = '#000b'; x.beginPath(); x.roundRect(4,8,504,80,22); x.fill();
  x.fillStyle = '#fff'; x.font = 'bold 42px system-ui,"Noto Sans Bengali",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text,256,50);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false})); s.scale.set(16,3,1); s.position.y = y; return s; }

// ---------- roads & river ----------
const ROADS = [
 [[30,-104],[0,-70],[0,-40],[0,0],[0,100],[22,160]],
 [[-100,-20],[0,0],[44,42],[84,18],[118,60]],
 [[-100,-100],[-34,-76],[0,-40],[62,-42],[130,-62]],

 [[-62,30],[-62,100],[-12,122],[22,160]],[[22,160],[-78,190]],

];
const roadMat = M(0x3b3b3f);
const SEG = []; ROADS.forEach(pl => { for(let i=0;i<pl.length-1;i++){ const [a,b] = [pl[i],pl[i+1]]; SEG.push([a,b]); const dx=b[0]-a[0], dz=b[1]-a[1], len=Math.hypot(dx,dz);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(7,len+3).rotateX(-Math.PI/2), roadMat); m.position.set((a[0]+b[0])/2,.03,(a[1]+b[1])/2); m.rotation.y = Math.atan2(dx,dz); m.receiveShadow = true; scene.add(m);
  const dot = new THREE.Mesh(new THREE.PlaneGeometry(.3,len).rotateX(-Math.PI/2), M(0xe8e0a0)); dot.position.set(m.position.x,.05,m.position.z); dot.rotation.y = m.rotation.y; scene.add(dot); }});
const RIVER = [[-262,-230],[-175,-150],[-150,-60],[-172,20],[-150,100],[-190,200],[-232,262]];
const waterMat = new THREE.MeshLambertMaterial({color:0x2f8fd0});
const RSEG = []; for(let i=0;i<RIVER.length-1;i++){ const [a,b] = [RIVER[i],RIVER[i+1]]; RSEG.push([a,b]); const dx=b[0]-a[0], dz=b[1]-a[1], len=Math.hypot(dx,dz);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(16,len+8).rotateX(-Math.PI/2), waterMat); m.position.set((a[0]+b[0])/2,.04,(a[1]+b[1])/2); m.rotation.y = Math.atan2(dx,dz); scene.add(m); }
function dSeg(x,z,[a,b]){ const dx=b[0]-a[0], dz=b[1]-a[1]; let t = ((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz); t = Math.max(0,Math.min(1,t)); return Math.hypot(x-a[0]-t*dx, z-a[1]-t*dz); }
const dRoad = (x,z) => Math.min(...SEG.map(s => dSeg(x,z,s)));
const dRiver = (x,z) => Math.min(...RSEG.map(s => dSeg(x,z,s)));

// ---------- city blocks, trees ----------
let seed = 11; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const blds = [], pal = [0xe8d9b5,0xd9a37a,0xb5c9d9,0xe0b5b5,0xc9d9b5,0xf0e0c0,0xcfcfcf];
for(let i=0;i<4000 && blds.length<190;i++){
  const x=(rnd()-.5)*340, z=-140+rnd()*340, dr = dRoad(x,z);
  if(dr<8 || dr>20 || dRiver(x,z)<16 || nearLM(x,z,8) || Math.abs(x)>HALF-20) continue;
  const w=5+rnd()*5, d=5+rnd()*5, h=3+rnd()*(Math.hypot(x,z-30)<70?9:4);
  if(colliders.some(c => Math.hypot(c.x-x,c.z-z) < c.r+Math.max(w,d)*.7+1)) continue;
  blds.push({x,z,w,d,h,c:pal[Math.floor(rnd()*pal.length)]}); colliders.push({x,z,r:Math.max(w,d)*.55});
}

];
const QUESTS = [

 {t:'জাহাজ কোম্পানি মোড়ের রফিক ভাইয়ের সাথে কথা বলো', ty:'talk', id:'dokan', r:30},
 {t:'টাউন হলে গিয়ে ডেভিডের সাথে কথা বলো', ty:'talk', id:'tourist', r:40},
 {t:'কারমাইকেল কলেজে নাজমুলের সাথে কথা বলো', ty:'talk', id:'student', r:50},
 {t:'তাজহাট জমিদার বাড়ির গাইডের সাথে কথা বলো', ty:'talk', id:'guide', r:60},
 {t:'ভিন্ন জগতে গিয়ে মিঠুর সাথে কথা বলো', ty:'talk', id:'astro', r:80},
];
let qi = 0, money = 0, talk = null;
const objective = () => { const q = QUESTS[qi]; if(!q) return null; if(q.ty==='visit'){ const l = LM.find(l=>l.id===q.id); return [l.x,l.z]; } const n = NPC.find(n=>n.id===q.id); return n.at; };
function panel(){ const q = QUESTS[qi]; const o = objective(); const d = o && cur ? Math.round(Math.hypot(o[0]-cur.position.x, o[1]-cur.position.z)) : 0;
  $('quest').innerHTML = q ? `<b>কাজ ${qi+1}/${QUESTS.length}</b><br>${q.t}<br>📍 ${d} মি দূরে` : '<b>🎉 সব কাজ শেষ!</b><br>এখন যেখানে খুশি ঘোরো।'; $('money').textContent = money; }
function toast(t){ const e = $('toast'); e.textContent = t; e.style.opacity = 1; setTimeout(() => e.style.opacity = 0, 2600); }
function done(){ const r = 50 + qi*10; money += r; toast(`✔ কাজ শেষ! +${r} টাকা`); qi++; }
NPC.forEach(async n => { const {root, clips} = await loadChar(n.ch); const o = SU.clone(root); o.position.set(n.at[0],0,n.at[1]); o.rotation.y = Math.PI*(.8+rnd()*.4); scene.add(o);
  const mx = new THREE.AnimationMixer(o), c = clipOf(clips,'Idle'); if(c){ const a = mx.clipAction(c); a.time = rnd()*2; a.play(); } n.root = o; n.mixer = mx;
  const s = label(n.name, 2.6); s.scale.set(6,1.1,1); o.add(s); n.sprite = s; colliders.push({x:n.at[0],z:n.at[1],r:.5}); });
function nearestNPC(){ let b = null, bd = 3.6; NPC.forEach(n => { if(!n.root||!cur) return; const d = Math.hypot(n.at[0]-cur.position.x, n.at[1]-cur.position.z); if(d<bd){ bd = d; b = n; } }); return b; }
function say(){ $('dn').textContent = talk.n.name; $('dt').textContent = talk.lines[talk.i]; $('dlg').style.display = 'block'; }
function startTalk(n){ const q = QUESTS[qi], turn = !!q && q.ty==='talk' && q.id===n.id && n.quest.length; talk = {n, i:0, lines: turn ? n.quest : n.idle, turn};
  const dx = cur.position.x-n.at[0], dz = cur.position.z-n.at[1]; n.root.rotation.y = Math.atan2(dx,dz); say(); }
function nextLine(){ talk.i++; if(talk.i >= talk.lines.length){ const t = talk.turn; talk = null; $('dlg').style.display = 'none'; if(t) done(); panel(); } else say(); }

// ---------- input & flow ----------
const keys = {}; let yaw = 0, pitch = .35, dist = 6, drag = false;
function begin(){ mode = 'play'; $('select').style.display = 'none'; ['hud','quest'].forEach(i => $(i).style.display = 'block'); $('mini').style.display = 'block'; play('Idle'); yaw = 0; panel(); toast('রংপুর স্টেশনে নামলে — চা-ওয়ালার সাথে কথা বলো (E)'); }
$('start').onclick = begin;
addEventListener('keydown', e => { keys[e.code] = true;
  if(mode==='select'){ if(e.code==='ArrowLeft') cycle(-1); if(e.code==='ArrowRight') cycle(1); if(e.code==='Enter') begin(); return; }
  if(e.code==='KeyE'){ if(talk) nextLine(); else { const n = nearestNPC(); if(n) startTalk(n); else waveT = 2; } }
  if(e.code==='KeyC' && !talk){ mode = 'select'; $('select').style.display = 'flex'; ['hud','quest','mini'].forEach(i => $(i).style.display = 'none'); play('Wave'); } });
addEventListener('keyup', e => keys[e.code] = false);
renderer.domElement.addEventListener('pointerdown', () => drag = true); addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => { if(drag && mode==='play'){ yaw -= e.movementX*.005; pitch = Math.min(1.2, Math.max(.05, pitch+e.movementY*.005)); }});
addEventListener('wheel', e => dist = Math.min(14, Math.max(3, dist+e.deltaY*.01)));
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- minimap ----------
const mini = $('mini'), mc = mini.getContext('2d'), K = mini.width/(HALF*2), bg = document.createElement('canvas'); bg.width = bg.height = mini.width;
{ const b = bg.getContext('2d'); b.fillStyle = '#5f9f46'; b.fillRect(0,0,bg.width,bg.height); const P = (x,z) => [(x+HALF)*K,(z+HALF)*K];
  b.lineCap = 'round'; b.strokeStyle = '#2f8fd0'; b.lineWidth = 16*K; b.beginPath(); RIVER.forEach((p,i) => b[i?'lineTo':'moveTo'](...P(...p))); b.stroke();
  b.strokeStyle = '#ddd'; b.lineWidth = 7*K+1; ROADS.forEach(pl => { b.beginPath(); pl.forEach((p,i) => b[i?'lineTo':'moveTo'](...P(...p))); b.stroke(); });
  b.fillStyle = '#c44'; LM.forEach(l => { const [x,y] = P(l.x,l.z); b.beginPath(); b.arc(x,y,4,0,7); b.fill(); }); }
function drawMini(){ mc.drawImage(bg,0,0); const P = (x,z) => [(x+HALF)*K,(z+HALF)*K]; const o = objective();
  if(o){ const [x,y] = P(...o); mc.fillStyle = '#ffd400'; mc.beginPath(); mc.arc(x,y,7,0,7); mc.fill(); }
  const [px,py] = P(cur.position.x, cur.position.z); mc.fillStyle = '#fff'; mc.strokeStyle = '#000'; mc.lineWidth = 2; mc.beginPath(); mc.arc(px,py,6,0,7); mc.fill(); mc.stroke(); }

// ---------- loop ----------
const clock = new THREE.Clock(), look = new THREE.Vector3(); let curPlace = '', pt = 0;
function tick(){
  const dt = Math.min(clock.getDelta(), .05);
  spinners.forEach(s => s.rotation.z += dt*.25);
  NPC.forEach(n => n.mixer && n.mixer.update(dt));
  if(mode==='play' && !talk){
    const f = (keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), r = (keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    if(f||r){ const run = keys.ShiftLeft||keys.ShiftRight, sp = run?9:3.8; const dx = -Math.sin(yaw)*f+Math.cos(yaw)*r, dz = -Math.cos(yaw)*f-Math.sin(yaw)*r, len = Math.hypot(dx,dz);
      const ox = cur.position.x, oz = cur.position.z; cur.position.x += dx/len*sp*dt; cur.position.z += dz/len*sp*dt;
      let d = Math.atan2(dx,dz)-cur.rotation.y; d = Math.atan2(Math.sin(d),Math.cos(d)); cur.rotation.y += d*Math.min(1,dt*12); waveT = 0; play(run?'Run':'Walk');
      if(dRiver(cur.position.x,cur.position.z) < 7){ cur.position.x = ox; cur.position.z = oz; }
    } else if(waveT>0){ waveT -= dt; play('Wave'); } else play('Idle');
    for(const c of colliders){ const ox = cur.position.x-c.x, oz = cur.position.z-c.z, dd = Math.hypot(ox,oz), mn = c.r+.4; if(dd<mn && dd>0){ cur.position.x = c.x+ox/dd*mn; cur.position.z = c.z+oz/dd*mn; } }
    cur.position.x = Math.max(-HALF+4, Math.min(HALF-4, cur.position.x)); cur.position.z = Math.max(-HALF+4, Math.min(HALF-4, cur.position.z));
    const q = QUESTS[qi]; if(q && q.ty==='visit'){ const l = LM.find(l=>l.id===q.id); if(Math.hypot(l.x-cur.position.x,l.z-cur.position.z) < l.r*.9){ done(); } }
    const n = nearestNPC(); $('prompt').style.display = n ? 'block' : 'none'; if(n) $('prompt').textContent = `E চাপো — ${n.name}`;
    pt -= dt; if(pt<=0){ pt = .5; panel(); const here = LM.find(l => Math.hypot(l.x-cur.position.x,l.z-cur.position.z) < l.r*.8); if(here && here.id !== curPlace){ curPlace = here.id; const p = $('place'); p.textContent = '📍 '+here.name; p.style.opacity = 1; setTimeout(() => p.style.opacity = 0, 2400); } else if(!here) curPlace = ''; }
    LM.forEach(l => l.label.visible = Math.hypot(l.x-cur.position.x,l.z-cur.position.z) < 110);
  }
  if(cur){
    if(mode==='play'){ look.set(cur.position.x,1.5,cur.position.z); camera.position.set(look.x+Math.sin(yaw)*Math.cos(pitch)*dist, look.y+Math.sin(pitch)*dist, look.z+Math.cos(yaw)*Math.cos(pitch)*dist); drawMini(); }
    else { cur.rotation.y += dt*.6; look.set(cur.position.x,1.1,cur.position.z); camera.position.set(look.x,1.5,look.z+4.4); }
    camera.lookAt(look); sun.position.set(cur.position.x+35,55,cur.position.z+25); sun.target.position.copy(cur.position); mixer && mixer.update(dt);
  }
  renderer.render(scene,camera); requestAnimationFrame(tick);
}
camera.position.set(SPAWN[0],1.5,SPAWN[1]+4.4);
show(0).then(() => { $('load').remove(); tick(); });
